name: Build iOS IPA

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Xcode Version
        run: |
          xcodebuild -version

      - name: Build & Package IPA
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild clean build \
            -project PCSpeaker.xcodeproj \
            -scheme PCSpeaker \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/xcodebuild.log || {
              echo "=== PRINTING XCODEBUILD ERRORS ==="
              python3 -c "
              import re
              with open('build/xcodebuild.log', 'r', errors='ignore') as f:
                  for line in f:
                      if re.search(r'\b(error|fatal error):', line, re.IGNORECASE):
                          print('::error::' + line.strip())
              "
              exit 1
            }

          APP_PATH=$(find build/DerivedData -name "PCSpeaker.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: PCSpeaker.app not found!"
            exit 1
          fi

          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r PCSpeaker.ipa Payload
          echo "IPA File Generated:"
          ls -lh PCSpeaker.ipa

      - name: Upload Build Log On Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-failure-log
          path: build/xcodebuild.log
          retention-days: 7

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCSpeaker-iOS-IPA
          path: build/PCSpeaker.ipa
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "PC Speaker iOS Release v1.0.0 (#${{ github.run_number }})"
          body: |
            ### 🔊 PC Speaker - iOS Receiver Build
            - Phiên bản: `1.0.0` (Build #${{ github.run_number }})
            - Commit: `${{ github.sha }}`
            - Cài đặt file `PCSpeaker.ipa` trực tiếp qua **TrollStore, AltStore, Sideloadly, hoặc Scarlet**.
          files: build/PCSpeaker.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
