name: Build iOS IPA

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build & Archive PCSpeaker
        run: |
          mkdir -p build
          xcodebuild archive \
            -project PCSpeaker.xcodeproj \
            -scheme PCSpeaker \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PCSpeaker.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Payload into IPA
        run: |
          mkdir -p build/Payload
          cp -r build/PCSpeaker.xcarchive/Products/Applications/PCSpeaker.app build/Payload/
          cd build
          zip -r PCSpeaker.ipa Payload
          echo "IPA Size:"
          ls -lh PCSpeaker.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCSpeaker-iOS-IPA
          path: build/PCSpeaker.ipa
          retention-days: 30

      - name: Create GitHub Release (On Push to Main/Master)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "PC Speaker iOS Release v1.0.0 (#${{ github.run_number }})"
          body: |
            ### 🔊 PC Speaker - iOS Receiver Build
            - Phiên bản: `1.0.0` (Build #${{ github.run_number }})
            - Commit: `${{ github.sha }}`
            - Cài đặt file `PCSpeaker.ipa` trực tiếp qua **TrollStore, AltStore, Sideloadly, hoặc Scarlet**.
          files: build/PCSpeaker.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
